{% extends "base.html" %}
{% block content %}
<h1>Reset Password</h1>
{% if message %}<p>{{ message }}</p>{% endif %}
<form method="POST">
  <input type="text" name="username" placeholder="username target"><br>
  <input type="text" name="new_password" placeholder="password baru"><br>
  <button type="submit">Reset</button>
</form>
<p>Tidak ada verifikasi identitas sama sekali di sini.</p>
{% endblock %}
