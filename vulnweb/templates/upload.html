{% extends "base.html" %}
{% block content %}
<h1>Upload File</h1>
{% if message %}<p>{{ message }}</p>{% endif %}
<form method="POST" enctype="multipart/form-data">
  <input type="file" name="file"><br>
  <button type="submit">Upload</button>
</form>
<p>Tidak ada filter ekstensi. File hasil upload bisa diakses di /uploads/&lt;nama_file&gt;</p>
{% endblock %}
